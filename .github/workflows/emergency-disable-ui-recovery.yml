name: Emergency disable UI recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-disable-ui-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove recovery runtime from index
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'\n?<script\s+id="sak-ui-recovery-runtime"[^>]*></script>\s*', '\n', s, count=1, flags=re.I)
          if s2==s:
              print('Recovery runtime already absent')
          p.write_text(s2,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          ! grep -Fq 'sak-ui-recovery-runtime' index.html
      - name: Commit emergency rollback
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git add index.html
          git commit -m 'Emergency disable UI recovery runtime'
          git push
