name: Add image-to-video gull icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-image-to-video-gull.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image-to-video gull launcher
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- SAKAKER BUSINESS IMAGE-TO-VIDEO GULL -->'
          if marker in s:
              print('Launcher already present')
              raise SystemExit(0)
          block = Path('assets/image-to-video-gull-snippet.html').read_text(encoding='utf-8')
          if '</body>' not in s:
              raise SystemExit('index.html has no </body>')
          s = s.replace('</body>', block + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add image-to-video gull launcher for Sakaker Business"
          git push
