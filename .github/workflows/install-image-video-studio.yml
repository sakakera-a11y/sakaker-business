name: Install image to video studio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-image-video-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy studio from main Sakaker site
        run: |
          curl -fsSL https://raw.githubusercontent.com/sakakera-a11y/sakaker/main/audio-video.html -o audio-video.html
          test -s audio-video.html
          grep -Fq 'Audio to Video Studio' audio-video.html
          grep -Fq 'تحويل الصوت إلى فيديو' audio-video.html

      - name: Add matching launcher runtime
        shell: bash
        run: |
          mkdir -p assets
          cat > assets/image-video-launcher.js <<'JS'
          (()=>{
            'use strict';
            const ID='sakBusinessImageVideoLauncher';
            if(document.getElementById(ID)) return;
            const style=document.createElement('style');
            style.id='sakBusinessImageVideoLauncherStyle';
            style.textContent=`
              #${ID}{position:fixed;left:18px;bottom:92px;z-index:2147483000;width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,226,138,.95);background:radial-gradient(circle at 35% 28%,#ffffff 0 7%,#83fff0 8% 18%,#0b817d 42%,#05252a 72%,#020b0e 100%);box-shadow:0 0 12px rgba(109,255,233,.8),0 0 28px rgba(109,255,233,.4),0 0 38px rgba(255,226,138,.2),inset 0 0 14px rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;font-size:28px;cursor:pointer;user-select:none;transition:transform .2s ease,filter .2s ease;animation:sakIvPulse 2.6s ease-in-out infinite}
              #${ID}:hover{transform:translateY(-3px) scale(1.05);filter:brightness(1.14)}
              #${ID}:focus-visible{outline:2px solid #ffe28a;outline-offset:3px}
              #${ID} span{filter:drop-shadow(0 0 6px rgba(255,255,255,.85))}
              @keyframes sakIvPulse{0%,100%{box-shadow:0 0 12px rgba(109,255,233,.72),0 0 25px rgba(109,255,233,.32),0 0 36px rgba(255,226,138,.16),inset 0 0 14px rgba(255,255,255,.16)}50%{box-shadow:0 0 17px rgba(109,255,233,.95),0 0 34px rgba(109,255,233,.5),0 0 44px rgba(255,226,138,.28),inset 0 0 18px rgba(255,255,255,.22)}}
              @media(max-width:600px){#${ID}{width:54px;height:54px;left:12px;bottom:82px;font-size:24px}}
            `;
            document.head.appendChild(style);
            const b=document.createElement('button');
            b.id=ID;b.type='button';b.innerHTML='<span>🎬</span>';
            function label(){return (document.documentElement.lang||'ar').toLowerCase().startsWith('en')?'Image / Audio to Video':'تحويل الصورة / الصوت إلى فيديو'}
            function sync(){const t=label();b.title=t;b.setAttribute('aria-label',t)}
            sync();
            b.addEventListener('click',()=>{location.href='/audio-video.html'});
            document.body.appendChild(b);
            new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script id="sak-business-image-video-launcher-runtime" src="/assets/image-video-launcher.js?v=20261003-1" defer></script>'
          if 'id="sak-business-image-video-launcher-runtime"' in s:
              s=re.sub(r'<script\s+id="sak-business-image-video-launcher-runtime"[^>]*></script>',tag,s,count=1,flags=re.I)
          else:
              pos=s.lower().rfind('</body>')
              if pos<0: raise SystemExit('Closing body tag not found')
              s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify studio and launcher
        run: |
          test -s audio-video.html
          test -s assets/image-video-launcher.js
          grep -Fq 'sakBusinessImageVideoLauncher' assets/image-video-launcher.js
          grep -Fq "location.href='/audio-video.html'" assets/image-video-launcher.js
          grep -Fq 'id="sak-business-image-video-launcher-runtime"' index.html
          node --check assets/image-video-launcher.js

      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- audio-video.html assets/image-video-launcher.js index.html; then
            echo 'Already installed.'
            exit 0
          fi
          git add audio-video.html assets/image-video-launcher.js index.html
          git commit -m 'Install matching image to video studio on Business site'
          git push origin HEAD:main
