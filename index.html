<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import { getAnalytics }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";


import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
setPersistence,
browserLocalPersistence,
signOut
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import { getFirestore }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


import { getStorage }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";



const firebaseConfig = {

apiKey:"AIzaSyBXqge71Xec5iNNZuYVvODJPgXZltojVCA",

authDomain:"sakaker-basnusse.firebaseapp.com",

projectId:"sakaker-basnusse",

storageBucket:"sakaker-basnusse.firebasestorage.app",

messagingSenderId:"369109440957",

appId:"1:369109440957:web:a3a460e5ef14c46a0d5ad4",

measurementId:"G-FKQFWD7E2Z"

};


const app=initializeApp(firebaseConfig);


const analytics=getAnalytics(app);

const auth=getAuth(app);

const db=getFirestore(app);

const storage=getStorage(app);


window.firebaseApp=app;

window.firebaseAuth=auth;

window.firebaseDB=db;

window.firebaseStorage=storage;


await setPersistence(
auth,
browserLocalPersistence
);


const overlay=document.getElementById("loginOverlay");

const email=document.getElementById("emailInput");

const pass=document.getElementById("passwordInput");

const error=document.getElementById("loginError");
const paymentGate=document.getElementById("paymentGate");
const paymentContinue=document.getElementById("paymentContinue");
const paymentMessage=document.getElementById("paymentMessage");
const PAYMENT_KEY="sakaker_business_paid_v1";

function hasPaid(){
  /* لا نعتمد على localStorage كإثبات دفع */
  return false;
}

function showPaymentGate(){
  paymentGate.style.display="flex";
  overlay.style.display="none";
  document.body.classList.add("locked");
}

function showLoginGate(){
  paymentGate.style.display="none";
  overlay.style.display="flex";
  document.body.classList.add("locked");
}

if(hasPaid()){
  paymentGate.style.display="none";
  overlay.style.display="flex";
}else{
  showPaymentGate();
}

/* =========================================================
   🔐 الدفع: لا يتم اعتبار الدفع مؤكداً من المتصفح.
   زر "أتممت الدفع" لا يفتح تسجيل الدخول.
   يجب أن تأتي حالة الدفع من جهة موثوقة/خادم PayPal ثم تُحفظ
   في Firebase قبل السماح بالدخول.
========================================================= */
if(paymentContinue){
  paymentContinue.textContent="🔒 التحقق من الدفع مطلوب";
  paymentContinue.disabled=true;
  paymentContinue.style.opacity=".55";
  paymentContinue.style.cursor="not-allowed";
  paymentContinue.onclick=()=>{
    paymentMessage.textContent="⛔ لا يمكن فتح تسجيل الدخول قبل التحقق من نجاح الدفع.";
  };
}



/* دخول */

document.getElementById("loginButton").onclick=async()=>{


try{


await signInWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};



/* إنشاء حساب */

document.getElementById("signupButton").onclick=async()=>{


try{


await createUserWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};




/* Google */

document.getElementById("googleButton").onclick=async()=>{


const provider=new GoogleAuthProvider();


try{


await signInWithPopup(
auth,
provider
);


}catch(e){

error.textContent="❌ "+e.message;

}


};




/* مراقبة الدخول */

onAuthStateChanged(auth,async(user)=>{

  if(user && hasPaid()){

    paymentGate.style.display="none";
    overlay.style.display="none";
    document.body.classList.remove("locked");

    document.getElementById("userProfile").style.display="flex";
    document.getElementById("userName").textContent = user.displayName || user.email;
    document.getElementById("userPhoto").src = user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

  }else if(user && !hasPaid()){

    try{ await signOut(auth); }catch(e){}
    showPaymentGate();
    document.getElementById("userProfile").style.display="none";

  }else{

    document.getElementById("userProfile").style.display="none";

    if(hasPaid()){
      showLoginGate();
    }else{
      showPaymentGate();
    }
  }

});




/* خروج */

document.getElementById("logoutButton").onclick=async()=>{

await signOut(auth);

};



console.log("SAKAKER Firebase Ready");

</script>
