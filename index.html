<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import { getAnalytics }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
setPersistence,
browserLocalPersistence,
signOut
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import { getFirestore }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import { getStorage }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";

const firebaseConfig = {
apiKey:"AIzaSyBXqge71Xec5iNNZuYVvODJPgXZltojVCA",
authDomain:"sakaker-basnusse.firebaseapp.com",
projectId:"sakaker-basnusse",
storageBucket:"sakaker-basnusse.firebasestorage.app",
messagingSenderId:"369109440957",
appId:"1:369109440957:web:a3a460e5ef14c46a0d5ad4",
measurementId:"G-FKQFWD7E2Z"
};

const app=initializeApp(firebaseConfig);
const analytics=getAnalytics(app);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);

window.firebaseApp=app;
window.firebaseAuth=auth;
window.firebaseDB=db;
window.firebaseStorage=storage;

await setPersistence(
auth,
browserLocalPersistence
);

const overlay=document.getElementById("loginOverlay");
const email=document.getElementById("emailInput");
const pass=document.getElementById("passwordInput");
const error=document.getElementById("loginError");
const paymentGate=document.getElementById("paymentGate");
const paymentContinue=document.getElementById("paymentContinue");
const paymentMessage=document.getElementById("paymentMessage");
const PAYMENT_KEY="sakaker_business_paid_v1";

// Session-paid marker
window._sakakerPaid = false;

async function checkPaymentForEmail(emailAddr){
  try{
    const resp = await fetch('/payments/check?email='+encodeURIComponent(emailAddr));
    if(!resp.ok) return false;
    const j = await resp.json();
    return !!j.paid;
  }catch(e){
    console.error('checkPaymentForEmail error', e);
    return false;
  }
}

function hasPaid(){
  return !!window._sakakerPaid;
}

function showPaymentGate(){
  paymentGate.style.display="flex";
  overlay.style.display="none";
  document.body.classList.add("locked");
}

function showLoginGate(){
  paymentGate.style.display="none";
  overlay.style.display="flex";
  document.body.classList.add("locked");
}

if(hasPaid()){
  paymentGate.style.display="none";
  overlay.style.display="flex";
}else{
  showPaymentGate();
}

/* =========================================================
   🔐 الدفع: لا يتم اعتبار الدفع مؤكداً من المتصفح.
   زر "أتممت الدفع" لا يفتح تسجيل الدخول.
   يجب أن تأتي حالة الدفع من جهة موثوقة/خادم PayPal ثم تُحفظ
   في Firebase قبل السماح بالدخول.
========================================================= */
if(paymentContinue){
  paymentContinue.textContent="🔒 التحقق من الدفع مطلوب";
  paymentContinue.disabled=true;
  paymentContinue.style.opacity=".55";
  paymentContinue.style.cursor="not-allowed";
  paymentContinue.onclick=()=>{
    paymentMessage.textContent="⛔ لا يمكن فتح تسجيل الدخول قبل التحقق من نجاح الدفع.";
  };
}

// Load PayPal SDK dynamically only when client-id is provided via meta or global
async function loadPayPalSdk(clientId){
  if(!clientId) throw new Error('No PayPal client id');
  if(window.paypal) return window.paypal;
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = `https://www.paypal.com/sdk/js?client-id=${clientId}&currency=USD`;
    s.async = true;
    s.onload = ()=> resolve(window.paypal);
    s.onerror = (e)=> reject(e);
    document.head.appendChild(s);
  });
}

// Determine client id: priority - meta tag, global window.SAKAKER_PAYPAL_CLIENT_ID
function getPaypalClientId(){
  const meta = document.querySelector('meta[name="paypal-client-id"]');
  if(meta && meta.content && meta.content.trim() !== '' && meta.content !== 'YOUR_PAYPAL_CLIENT_ID') return meta.content.trim();
  if(window.SAKAKER_PAYPAL_CLIENT_ID && window.SAKAKER_PAYPAL_CLIENT_ID !== 'YOUR_PAYPAL_CLIENT_ID') return window.SAKAKER_PAYPAL_CLIENT_ID;
  return null;
}

async function renderPayPalButtons(){
  const clientId = getPaypalClientId();
  if(!clientId){
    document.getElementById('paymentArea').innerHTML = '<div style="color:#ffd700">بوابة الدفع غير مُهيأة حالياً — سيتم تفعيلها بعد إدخال PayPal Client ID.</div>';
    return;
  }

  try{
    const paypal = await loadPayPalSdk(clientId);
    paypal.Buttons({
      style: { layout: 'vertical', color: 'gold', shape: 'pill', label: 'pay' },
      createOrder: async function(data, actions){
        const res = await fetch('/paypal/create-order',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ amount: '4.99', currency: 'USD' })
        });
        const j = await res.json();
        return j.id;
      },
      onApprove: async function(data, actions){
        const resp = await fetch('/paypal/capture-order',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ orderID: data.orderID, email: document.getElementById('emailInput')?.value || null })
        });
        const body = await resp.json();
        if(body.ok){
          paymentMessage.textContent = '✅ تم الدفع بنجاح — التحقق آمن.';
          paymentContinue.disabled = false;
          paymentContinue.style.opacity = '1';
          paymentContinue.style.cursor = 'pointer';
          window._sakakerPaid = true;
        }else{
          paymentMessage.textContent = '❌ فشل التحقق من الدفع.';
        }
      },
      onError: function(err){
        paymentMessage.textContent = '❌ خطأ في معالجة الدفع';
        console.error(err);
      }
    }).render('#paymentArea');
  }catch(e){
    console.error('Failed to load PayPal SDK or render buttons', e);
    document.getElementById('paymentArea').textContent = 'تعذر تحميل بوابة الدفع، حاول لاحقًا.';
  }
}

// Call render on load
renderPayPalButtons();

/* دخول */

document.getElementById("loginButton").onclick=async()=>{
try{
await signInWithEmailAndPassword(
auth,
email.value,
pass.value
);
}catch(e){
error.textContent="❌ "+e.message;
}
};

/* إنشاء حساب */

document.getElementById("signupButton").onclick=async()=>{
try{
await createUserWithEmailAndPassword(
auth,
email.value,
pass.value
);
}catch(e){
error.textContent="❌ "+e.message;
}
};

/* Google */

document.getElementById("googleButton").onclick=async()=>{
const provider=new GoogleAuthProvider();
try{
await signInWithPopup(
auth,
provider
);
}catch(e){
error.textContent="❌ "+e.message;
}
};

/* مراقبة الدخول */

onAuthStateChanged(auth,async(user)=>{
  if(user){
    const paid = await checkPaymentForEmail(user.email);
    if(paid){
      window._sakakerPaid = true;
      paymentGate.style.display="none";
      overlay.style.display="none";
      document.body.classList.remove("locked");
      document.getElementById("userProfile").style.display="flex";
      document.getElementById("userName").textContent = user.displayName || user.email;
      document.getElementById("userPhoto").src = user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    }else{
      try{ await signOut(auth); }catch(e){}
      showPaymentGate();
      document.getElementById("userProfile").style.display="none";
    }
  }else{
    document.getElementById("userProfile").style.display="none";
    if(hasPaid()){
      showLoginGate();
    }else{
      showPaymentGate();
    }
  }
});

/* خروج */

document.getElementById("logoutButton").onclick=async()=>{
await signOut(auth);
};

console.log("SAKAKER Firebase Ready");

</script>
