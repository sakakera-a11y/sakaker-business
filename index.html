const firebaseConfig = {

authDomain:"sakaker-basnusse.firebaseapp.com",

projectId:"sakaker-basnusse",

storageBucket:"sakaker-basnusse.firebasestorage.app",

messagingSenderId:"369109440957",

appId:"1:369109440957:web:a3a460e5ef14c46a0d5ad4",

measurementId:"G-FKQFWD7E2Z"

};


const app=initializeApp(firebaseConfig);


const analytics=getAnalytics(app);

const auth=getAuth(app);

const db=getFirestore(app);

const storage=getStorage(app);



window.firebaseApp=app;

window.firebaseAuth=auth;

window.firebaseDB=db;

window.firebaseStorage=storage;



await setPersistence(
auth,
browserLocalPersistence
);



const overlay=document.getElementById("loginOverlay");
const email=document.getElementById("emailInput");
const pass=document.getElementById("passwordInput");
const error=document.getElementById("loginError");

/* لا توجد بوابة دفع حاليًا. الاشتراك يضاف لاحقًا دون تغيير نظام الدخول. */
function showLoginGate(){
  overlay.style.display="flex";
  document.body.classList.add("locked");
}

function openSiteAfterLogin(){
  overlay.style.display="none";
  document.body.classList.remove("locked");
}

showLoginGate();

/* دخول */

document.getElementById("loginButton").onclick=async()=>{


try{


await signInWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};



/* إنشاء حساب */

document.getElementById("signupButton").onclick=async()=>{


try{


await createUserWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};




/* Google */

document.getElementById("googleButton").onclick=async()=>{


const provider=new GoogleAuthProvider();


try{


await signInWithPopup(
auth,
provider
);


}catch(e){

error.textContent="❌ "+e.message;

}


};





/* مراقبة الدخول */

onAuthStateChanged(auth,async(user)=>{
  if(user){
    openSiteAfterLogin();
    document.getElementById("userProfile").style.display="flex";
    document.getElementById("userName").textContent = user.displayName || user.email || "User";
    document.getElementById("userPhoto").src = user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
  }else{
    document.getElementById("userProfile").style.display="none";
    showLoginGate();
  }
});

/* خروج */

document.getElementById("logoutButton").onclick=async()=>{

await signOut(auth);

};



console.log("SAKAKER Firebase Ready");

</script>
  <script>
(function(){
  const ar=document.getElementById("langAR");
  const en=document.getElementById("langEN");
  const title=document.getElementById("loginTitle");
  const subtitle=document.getElementById("loginSubtitle");
  const email=document.getElementById("emailInput");
  const pass=document.getElementById("passwordInput");
  const login=document.getElementById("loginButton");
  const google=document.getElementById("googleButton");
  const signup=document.getElementById("signupButton");
  const footer=document.getElementById("loginFooter");
  const err=document.getElementById("loginError");

  function setLang(lang){
    const isAR=lang!=="en";
    document.documentElement.lang=isAR?"ar":"en";
    document.documentElement.dir=isAR?"rtl":"ltr";
    document.body.dir=isAR?"rtl":"ltr";
    title.textContent=isAR?"🔐 تسجيل الدخول":"🔐 Sign in";
    subtitle.innerHTML=isAR?"أهلاً بك في Sakaker Business<br>يرجى تسجيل الدخول للمتابعة إلى الموقع":"Welcome to Sakaker Business<br>Please sign in to continue";
    email.placeholder=isAR?"📧 البريد الإلكتروني":"📧 Email address";
    pass.placeholder=isAR?"🔒 كلمة المرور":"🔒 Password";
    login.textContent=isAR?"دخول":"Sign in";
    google.textContent=isAR?"🔵 الدخول بواسطة Google":"🔵 Continue with Google";
    signup.textContent=isAR?"📝 إنشاء حساب جديد":"📝 Create a new account";
    footer.textContent=isAR?"الوصول إلى محتوى الموقع محمي بتسجيل الدخول":"Access to the site content is protected by sign-in";
    ar.classList.toggle("active",isAR); en.classList.toggle("active",!isAR);
    if(err.dataset.system!="1") err.textContent="";
  }
  ar.onclick=()=>setLang("ar");
  en.onclick=()=>setLang("en");
  window.sakakerLoginLanguage={setLang};
  setLang("ar");
})();
</script>

<script>

const emeraldHost=document.getElementById("emeraldMusicHost");
const emOpenBtn=document.getElementById("emOpenBtn");

/* ================== الأصوات (آلات كثيرة) ================== */
const base={
  piano  :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/acoustic_grand_piano-mp3/",
  epiano :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/electric_piano_1-mp3/",
  oud    :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/acoustic_guitar_nylon-mp3/",
  buzuq  :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/acoustic_guitar_steel-mp3/",
  guitar :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/electric_guitar_clean-mp3/",
  bass   :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/electric_bass_finger-mp3/",
  qanun  :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/dulcimer-mp3/",
  violin :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/violin-mp3/",
  strings:"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/string_ensemble_1-mp3/",
  sax    :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/alto_sax-mp3/",
  trumpet:"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/trumpet-mp3/",
  nay    :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/flute-mp3/",
  choir  :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/choir_aahs-mp3/",
  drums  :"https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/standard_kit-mp3/"
};
const LABEL={
  piano:"🎹 Piano", epiano:"🎹 E-Piano", oud:"🪕 Oud", qanun:"🎼 Qanun", buzuq:"🪕 Buzuq",
  guitar:"🎸 Guitar", bass:"🎸 Bass", violin:"🎻 Violin", strings:"🎻 Strings",
  sax:"🎷 Sax", trumpet:"🎺 Trumpet", nay:"🎵 Nay", choir:"🎤 Choir", drums:"🥁 Drums"
};

/* ================== إعدادات ================== */
let inst="piano", mix="none", vol=1, echo=1, octShift=0;
const activeHold={};
let keyElByNote = {};

/* ================== نوتات 36 من D2 ================== */
const notes=[], order=["D","E","F","G","A","B","C"];
let o=2; while(notes.length<36){ for(const l of order){ if(notes.length<36) notes.push(l+o); } o++; }

/* ================== مساعدات ================== */
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function isBlack(n){ return ["E","G","B"].includes(n[0]); }
function noteWithOctShift(note){
  const letter = note[0];
  const baseOct = parseInt(note.slice(1),10);
  const finalOct = clamp(baseOct + octShift, 0, 9);
  return letter + finalOct;
}
function glow(){
  emeraldHost.classList.add("emGlow");
  setTimeout(()=>emeraldHost.classList.remove("emGlow"),120);
}
function highlightKey(note){
  const el = keyElByNote[note] || null;
  if(!el) return;
  el.classList.add("emKeyActive");
  try{ el.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"}); }catch(_){}
  setTimeout(()=>el.classList.remove("emKeyActive"),160);
}

/* ================== تشغيل ================== */
function playOnce(note, instName, volumeMul=1){
  const nn = noteWithOctShift(note);
  const src = (base[instName]||base.piano) + nn + ".mp3";
  const a = new Audio(src);
  a.volume = clamp((vol||1) * (volumeMul||1), 0, 1);
  a.play().catch(()=>{});
  return a;
}
function startHold(note, holdId, alsoEl=null){
  if(activeHold[holdId]) return;
  const arr=[];
  const nn = noteWithOctShift(note);

  const a1=new Audio((base[inst]||base.piano)+nn+".mp3");
  a1.loop=true; a1.volume=clamp(vol,0,1);
  a1.play().catch(()=>{});
  arr.push(a1);

  if(mix!=="none" && mix!==inst){
    const a2=new Audio((base[mix]||base.piano)+nn+".mp3");
    a2.loop=true; a2.volume=clamp(vol,0,1);
    a2.play().catch(()=>{});
    arr.push(a2);
  }

  activeHold[holdId]=arr;
  if(alsoEl) alsoEl.classList.add("emKeyActive");
}
function stopHold(id, alsoEl=null){
  if(!activeHold[id]) return;
  activeHold[id].forEach(a=>{ try{a.pause();}catch(_){} });
  delete activeHold[id];
  if(alsoEl) alsoEl.classList.remove("emKeyActive");
}
function shortPress(note, alsoEl=null){
  playOnce(note, inst, 1);
  if(mix!=="none" && mix!==inst) playOnce(note, mix, 1);

  const e = clamp(echo,0,2);
  if(e>0){
    const repeats=5, baseDelay=120;
    for(let i=1;i<=repeats;i++){
      const v = clamp((e/(i+0.2)) * 0.7, 0, 1);
      setTimeout(()=>{
        playOnce(note, inst, v);
        if(mix!=="none" && mix!==inst) playOnce(note, mix, v);
      }, baseDelay*i);
    }
  }

  if(alsoEl){
    alsoEl.classList.add("emKeyActive");
    try{ alsoEl.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"}); }catch(_){}
    setTimeout(()=>alsoEl.classList.remove("emKeyActive"),160);
  }else{
    highlightKey(note);
  }
}

/* ================== مقطوعات ================== */
const MELODIES={
  scale:["D2","E2","F2","G2","A2","B2","C2","D3","E3","F3","G3","A3","B3","C3","D4","E4","F4","G4","A4","B4","C4","D5"],
  hbd:["C4","C4","D4","C4","F4","E4","C4","C4","D4","C4","G4","F4","C4","C4","C5","A4","F4","E4","D4"],
  fairuz:["E4","F4","G4","A4","G4","F4","E4","D4","E4","F4","G4","A4","G4","F4","E4","D4"],
  beethoven9:[
    "E4","E4","F4","G4","G4","F4","E4","D4",
    "C4","C4","D4","E4","E4","D4","D4",
    "E4","E4","F4","G4","G4","F4","E4","D4",
    "C4","C4","D4","E4","D4","C4","C4"
  ],
  sabah:["G4","A4","B4","A4","G4","E4","D4","E4","G4","A4","G4","E4","D4"]
};
let timer=null;
function stopMelody(){ if(timer){ clearInterval(timer); timer=null; } }
function playMelody(arr, t=420){
  stopMelody();
  let i=0;
  timer=setInterval(()=>{ if(i>=arr.length) return stopMelody(); shortPress(arr[i++]); }, t);
}

/* ================== كاميرا/مايك ================== */
let camStream=null, mediaRecorder=null, chunks=[], camPaused=false;
let camTrack=null, micTrack=null;

async function startCamRecording(videoEl, recBtn, pauseBtn, camToggleBtn, micToggleBtn){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    videoEl.srcObject = camStream;

    camTrack = camStream.getVideoTracks()[0] || null;
    micTrack = camStream.getAudioTracks()[0] || null;

    chunks=[];
    mediaRecorder = new MediaRecorder(camStream);
    mediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(chunks,{type:"video/webm"});
      const url = URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="emerald-performance.webm"; a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    };

    mediaRecorder.start();
    camPaused=false;

    recBtn.textContent="⏹ Stop";
    pauseBtn.style.display="inline-block";
    pauseBtn.textContent="⏸ Pause";
    camToggleBtn.style.display="inline-block";
    micToggleBtn.style.display="inline-block";
    camToggleBtn.textContent="📷 Camera: ON";
    micToggleBtn.textContent="🎙 Mic: ON";
    camToggleBtn.classList.remove("emWarn");
    micToggleBtn.classList.remove("emWarn");
  }catch(e){
    alert("تعذر تشغيل الكاميرا/المايك.\nتأكد من HTTPS ومنح الصلاحيات.\n\n" + (e?.message||e));
  }
}
function stopCamRecording(recBtn, pauseBtn, camToggleBtn, micToggleBtn){
  try{ if(mediaRecorder && mediaRecorder.state!=="inactive") mediaRecorder.stop(); }catch(_){}
  try{ if(camStream) camStream.getTracks().forEach(t=>t.stop()); }catch(_){}
  mediaRecorder=null; camStream=null; camTrack=null; micTrack=null; camPaused=false;
  recBtn.textContent="🎥 Record Video";
  pauseBtn.style.display="none";
  camToggleBtn.style.display="none";
  micToggleBtn.style.display="none";
}

/* ================== تسجيل صوت مستقل بدون ملحقات ================== */
let emAudioStream=null, emAudioRecorder=null, emAudioChunks=[], emAudioPaused=false;

async function startAudioRecording(recBtn,pauseBtn,statusEl){
  try{
    emAudioStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    emAudioChunks=[];

    let mime="";
    if(window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm;codecs=opus")){
      mime="audio/webm;codecs=opus";
    }else if(window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm")){
      mime="audio/webm";
    }

    emAudioRecorder = mime ? new MediaRecorder(emAudioStream,{mimeType:mime}) : new MediaRecorder(emAudioStream);
    emAudioRecorder.ondataavailable=e=>{
      if(e.data && e.data.size) emAudioChunks.push(e.data);
    };
    emAudioRecorder.onstop=()=>{
      const type=emAudioRecorder?.mimeType || "audio/webm";
      const blob=new Blob(emAudioChunks,{type});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download="musical-instruments-audio.webm";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    };

    emAudioRecorder.start();
    emAudioPaused=false;
    recBtn.textContent="⏹ Stop Audio";
    pauseBtn.style.display="inline-block";
    pauseBtn.textContent="⏸ Pause Audio";
    statusEl.textContent="🔴 Audio Recording";
  }catch(e){
    alert("تعذر تشغيل تسجيل الصوت.\nتأكد من HTTPS ومنح صلاحية الميكروفون.\n\n"+(e?.message||e));
  }
}

function stopAudioRecording(recBtn,pauseBtn,statusEl){
  try{if(emAudioRecorder && emAudioRecorder.state!=="inactive") emAudioRecorder.stop();}catch(_){}
  try{if(emAudioStream) emAudioStream.getTracks().forEach(t=>t.stop());}catch(_){}
  emAudioStream=null;
  emAudioRecorder=null;
  emAudioPaused=false;
  recBtn.textContent="🎙 Record Audio";
  pauseBtn.style.display="none";
  statusEl.textContent="🎙 Audio Ready";
}

/* ================== فتح اللوحة ================== */
emOpenBtn.onclick=()=>{

        <div class="emRow">

          ⌨️ كيبورد: 1-0 ثم Q..P ثم A..L ثم Z..M (ضغط مستمر = استمرار)
        </div>

        <div class="emKeysWrap"><div id="emKeys"></div></div>

        <div class="emRow">
          <span class="emBadge">🎛 الآلة الأساسية</span>
          ${Object.keys(LABEL).map(k=>`<button class="emBtn ${k==="piano"?"emActive":""}" data-em-i="${k}">${LABEL[k]}</button>`).join("")}
        </div>

        <div class="emRow">
          <span class="emBadge">🔀 الدمج (Mix)</span>
          <button class="emBtn emActive" data-em-m="none">❌ Off</button>
          ${Object.keys(LABEL).map(k=>`<button class="emBtn" data-em-m="${k}">${LABEL[k]}</button>`).join("")}
        </div>

        <div class="emCredit">✨It works offline. إعداد وتصميم وإنتاج أبوالقمر زمرد Preparation, design, and production by abwalqmrzmrd× Emerald Music ✨</div>

        <div id="emNotesModal" class="emNotesModal">
          <div class="emNotesBox">
            <div class="emNotesClose">✖</div>
            <h3>🎼 نوتات المقطوعات</h3>
            <h4>🎼 Beethoven 9 (Simplified)</h4><p>${MELODIES.beethoven9.join(" ")}</p>
            <h4>🎵 Sabah (Simplified)</h4><p>${MELODIES.sabah.join(" ")}</p>
            <h4>🎹 Scale</h4><p>${MELODIES.scale.join(" ")}</p>
            <h4>🎂 Happy Birthday</h4><p>${MELODIES.hbd.join(" ")}</p>
            <h4>🎵 Fairuz (Short)</h4><p>${MELODIES.fairuz.join(" ")}</p>
          </div>
        </div>

      </div>
    </div>
  `;
  emeraldHost.appendChild(p);

  /* عناصر */
  const closeBtn = p.querySelector(".emClose");
  const cam = p.querySelector("#emCam");
  const camRec = p.querySelector("#emCamRec");
  const camPause = p.querySelector("#emCamPause");
  const camToggle = p.querySelector("#emCamToggle");
  const micToggle = p.querySelector("#emMicToggle");

  const audioRec = p.querySelector("#emAudioRec");
  const audioPause = p.querySelector("#emAudioPause");
  const audioStatus = p.querySelector("#emAudioStatus");

  const chatMessages = p.querySelector("#emChatMessages");
  const chatState = p.querySelector("#emChatState");
  const chatInput = p.querySelector("#emChatInput");
  const chatSend = p.querySelector("#emChatSend");
  const emojiBtn = p.querySelector("#emEmojiBtn");
  const emojiPanel = p.querySelector("#emEmojiPanel");

  const notesBtn = p.querySelector("#emNotesBtn");
  const notesModal = p.querySelector("#emNotesModal");
  const notesClose = p.querySelector(".emNotesClose");

  notesBtn.onclick=()=>{ notesModal.style.display="flex"; };
  notesClose.onclick=()=>{ notesModal.style.display="none"; };
  notesModal.addEventListener("click",(e)=>{ if(e.target===notesModal) notesModal.style.display="none"; });

  /* ================== الرموز التعبيرية ================== */
  const emEmojis=["😀","😂","😍","🥰","😎","🤩","😊","😉","😭","😢","😡","👍","👏","❤️","💚","💛","✨","🔥","🎵","🎶","🎹","🎸","🎻","🎺","🎷","🥁","🎤","🪕"];
  emojiPanel.innerHTML=emEmojis.map(x=>`<button type="button">${x}</button>`).join("");
  emojiBtn.onclick=()=>emojiPanel.classList.toggle("show");

    b.onclick=()=>{
      chatInput.value += b.textContent;
      chatInput.focus();
    };
  });

  /* ================== Firebase Business Chat ================== */
  let emUnsubscribeChat=null;
  const escHtml=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
  const currentChatUser=()=>{
    const u=window.firebaseAuth?.currentUser;
    return {
      uid:u?.uid || "guest",
      name:u?.displayName || u?.email || "Guest"
    };
  };

  async function initBusinessChat(){
    const api=window.emFirebaseChatAPI;
    if(!api || !window.firebaseDB){
      chatState.textContent="Firebase loading...";
      setTimeout(initBusinessChat,700);
      return;
    }

    chatState.textContent="Online";
    const q=api.query(
      api.collection(window.firebaseDB,"emeraldMusicChat"),
      api.orderBy("createdAt","desc"),
      api.limit(80)
    );

    emUnsubscribeChat=api.onSnapshot(q,snap=>{
      const me=currentChatUser();
      const rows=[];
      snap.forEach(doc=>{
        const d=doc.data()||{};
        rows.push(d);
      });
      rows.reverse();
      chatMessages.innerHTML=rows.map(d=>{
        const mine=(d.uid && me.uid!=="guest" && d.uid===me.uid);
        return `<div class="emChatMsg ${mine?"me":""}">
          <div class="emChatName">${escHtml(d.name||"Guest")}</div>
          <div>${escHtml(d.text||"")}</div>
        </div>`;
      }).join("");
      chatMessages.scrollTop=chatMessages.scrollHeight;
    },err=>{
      console.error("Firebase chat:",err);
      chatState.textContent="Check Firestore rules";
    });
  }

  async function sendChat(){
    const value=chatInput.value.trim();
    if(!value) return;
    const api=window.emFirebaseChatAPI;
    if(!api || !window.firebaseDB){
      chatState.textContent="Firebase not ready";
      return;
    }
    const me=currentChatUser();
    chatSend.disabled=true;
    try{
      await api.addDoc(api.collection(window.firebaseDB,"emeraldMusicChat"),{
        text:value.slice(0,500),
        uid:me.uid,
        name:me.name,
        createdAt:api.serverTimestamp()
      });
      chatInput.value="";
      emojiPanel.classList.remove("show");
    }catch(err){
      console.error("Send chat:",err);
      chatState.textContent="Send denied";
    }finally{
      chatSend.disabled=false;
      chatInput.focus();
    }
  }

  chatSend.onclick=sendChat;
  chatInput.addEventListener("keydown",e=>{
    if(e.key==="Enter" && !e.shiftKey){
      e.preventDefault();
      sendChat();
    }
  });
  initBusinessChat();

  closeBtn.onclick=()=>{
    stopMelody();
    notesModal.style.display="none";
    try{ if(mediaRecorder){ stopCamRecording(camRec, camPause, camToggle, micToggle); } }catch(_){}
    try{ if(emAudioRecorder){ stopAudioRecording(audioRec,audioPause,audioStatus); } }catch(_){}
    try{ if(emUnsubscribeChat) emUnsubscribeChat(); }catch(_){}
    Object.keys(activeHold).forEach(id=>stopHold(id));
    p.remove();
    document.documentElement.style.overflow = prevOverflow;
  };

  /* إغلاق عند الضغط خارج الصندوق + زر Esc */
  const modalEl = p.querySelector(".emModal");
  const boxEl = p.querySelector(".emBox");

  if(modalEl && boxEl){
    modalEl.addEventListener("click",(e)=>{
      if(e.target === modalEl){
        closeBtn.click();
      }
    });
  }

  const escHandler = (e)=>{
    if(e.key === "Escape"){
      try{ closeBtn.click(); }catch(_){}
    }
  };
  window.addEventListener("keydown", escHandler);

  // ضمان إزالة مستمع Esc عند الإغلاق
  const _origClose = closeBtn.onclick;
  closeBtn.onclick = ()=>{
    try{ window.removeEventListener("keydown", escHandler); }catch(_){}
    _origClose();
  };

  p.querySelector("#emBeet").onclick=()=>playMelody(MELODIES.beethoven9, 380);
  p.querySelector("#emSabah").onclick=()=>playMelody(MELODIES.sabah, 420);
  p.querySelector("#emScale").onclick=()=>playMelody(MELODIES.scale, 220);
  p.querySelector("#emHbd").onclick=()=>playMelody(MELODIES.hbd, 420);
  p.querySelector("#emFairuz").onclick=()=>playMelody(MELODIES.fairuz, 430);
  p.querySelector("#emStop").onclick=()=>stopMelody();

  /* الآلة */
  p.querySelectorAll("[data-em-i]").forEach(b=>{
    b.onclick=()=>{
      p.querySelectorAll("[data-em-i]").forEach(x=>x.classList.remove("emActive"));
      b.classList.add("emActive");
      inst=b.dataset.emI;
    };
  });
  /* الدمج */
  p.querySelectorAll("[data-em-m]").forEach(b=>{
    b.onclick=()=>{
      p.querySelectorAll("[data-em-m]").forEach(x=>x.classList.remove("emActive"));
      b.classList.add("emActive");
      mix=b.dataset.emM;
    };
  });

  p.querySelector("#emV").oninput=(e)=>vol = e.target.value/100;
  p.querySelector("#emE").oninput=(e)=>echo = e.target.value/100;

  const octVal=p.querySelector("#emOctVal");
  function renderOct(){ octVal.textContent = String(octShift); }
  p.querySelector("#emOctDown").onclick=()=>{ octShift=clamp(octShift-1,-2,2); renderOct(); };
  p.querySelector("#emOctUp").onclick=()=>{ octShift=clamp(octShift+1,-2,2); renderOct(); };
  renderOct();

  camRec.onclick=async()=>{
    if(!mediaRecorder){ await startCamRecording(cam, camRec, camPause, camToggle, micToggle); }
    else{ stopCamRecording(camRec, camPause, camToggle, micToggle); }
  };
  camPause.onclick=()=>{
    if(!mediaRecorder) return;
    if(!camPaused){ try{ mediaRecorder.pause(); }catch(_){}
      camPause.textContent="▶ Resume"; camPaused=true;
    }else{ try{ mediaRecorder.resume(); }catch(_){}
      camPause.textContent="⏸ Pause"; camPaused=false;
    }
  };
  camToggle.onclick=()=>{
    if(!camTrack) return;
    camTrack.enabled = !camTrack.enabled;
    camToggle.textContent = camTrack.enabled ? "📷 Camera: ON" : "📷 Camera: OFF";
    camToggle.classList.toggle("emWarn", !camTrack.enabled);
  };
  micToggle.onclick=()=>{
    if(!micTrack) return;
    micTrack.enabled = !micTrack.enabled;
    micToggle.textContent = micTrack.enabled ? "🎙 Mic: ON" : "🎙 Mic: OFF";
    micToggle.classList.toggle("emWarn", !micTrack.enabled);
  };

  audioRec.onclick=async()=>{
    if(!emAudioRecorder){
      await startAudioRecording(audioRec,audioPause,audioStatus);
    }else{
      stopAudioRecording(audioRec,audioPause,audioStatus);
    }
  };

  audioPause.onclick=()=>{
    if(!emAudioRecorder) return;
    if(!emAudioPaused){
      try{emAudioRecorder.pause();}catch(_){}
      emAudioPaused=true;
      audioPause.textContent="▶ Resume Audio";
      audioStatus.textContent="⏸ Audio Paused";
    }else{
      try{emAudioRecorder.resume();}catch(_){}
      emAudioPaused=false;
      audioPause.textContent="⏸ Pause Audio";
      audioStatus.textContent="🔴 Audio Recording";
    }
  };

  /* مفاتيح */
  const keysWrap=p.querySelector("#emKeys");
  const r1=document.createElement("div");
  const r2=document.createElement("div");
  r1.className=r2.className="emKeysRow";
  keyElByNote = {};

  notes.forEach((n,i)=>{
    const d=document.createElement("div");
    d.className="emKey "+(isBlack(n)?"emBlack":"emWhite");
    d.innerHTML=`<div class="n">${i+1}</div><small>${n}</small>`;
    const id="emKey-"+i;
    keyElByNote[n]=d;

    let downAt=0, didHold=false;
    d.onpointerdown=(ev)=>{
      ev.preventDefault();
      downAt=Date.now();
      didHold=false;
      const localDownAt=downAt;
      setTimeout(()=>{ if(downAt===localDownAt){ didHold=true; startHold(n, id, d); } }, 180);
    };
    const endPointer=()=>{ if(activeHold[id]) stopHold(id, d); downAt=0; };
    d.onpointerup=endPointer;
    d.onpointerleave=endPointer;
    d.onpointercancel=endPointer;

    d.onclick=()=>{ if(didHold) return; shortPress(n, d); };
    (i<18?r1:r2).appendChild(d);
  });
  keysWrap.append(r1,r2);
};

/* ================== كيبورد الكمبيوتر ================== */
const KEY_BIND=[
  "Digit1","Digit2","Digit3","Digit4","Digit5","Digit6","Digit7","Digit8","Digit9","Digit0",
  "KeyQ","KeyW","KeyE","KeyR","KeyT","KeyY","KeyU","KeyI","KeyO","KeyP",
  "KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyJ","KeyK","KeyL",
  "KeyZ","KeyX","KeyC","KeyV","KeyB","KeyN","KeyM"
];
const KI={}; KEY_BIND.forEach((k,i)=>KI[k]=i);

window.addEventListener("keydown",(e)=>{
  if(e.repeat) return;
  const idx=KI[e.code];
  if(idx===undefined || !notes[idx]) return;
  const note=notes[idx];
  startHold(note, "emKb-"+idx, keyElByNote[note]||null);
});
window.addEventListener("keyup",(e)=>{
  const idx=KI[e.code];
  if(idx===undefined) return;
  const note=notes[idx];
  stopHold("emKb-"+idx, keyElByNote[note]||null);
});
</script>

<script type="module">

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const CHAT_MAX_AGE = 5 * 60 * 1000; // 5 دقائق
const CHAT_COLLECTION = "emeraldMusicChat";

let chatCleanupStarted = false;

/* البحث عن نافذة الرسائل */
function getChatContainer() {
  return (
    document.getElementById("chatMessages") ||
    document.querySelector(".chatMessages") ||
    document.querySelector(".emChatMessages")
  );
}

/* تحويل createdAt إلى milliseconds */
function getCreatedTime(createdAt) {

  if (!createdAt) return 0;

  if (typeof createdAt.toMillis === "function") {
    return createdAt.toMillis();
  }

  if (createdAt.seconds) {
    return createdAt.seconds * 1000;
  }

  if (createdAt instanceof Date) {
    return createdAt.getTime();
  }

  if (typeof createdAt === "number") {
    return createdAt;
  }

  return 0;
}

/* تنظيف الرسائل القديمة من الشاشة */
function hideExpiredMessages(messages) {

  const container = getChatContainer();

  if (!container) return;

  const now = Date.now();

  const expired = messages.filter(msg => {

    const created = getCreatedTime(msg.createdAt);

    return created > 0 && (now - created >= CHAT_MAX_AGE);

  });

  if (!expired.length) return;

  const elements = container.querySelectorAll(".emChatMsg");

  elements.forEach(element => {

    const text = element.innerText || "";

    expired.forEach(msg => {

      const name = String(msg.name || "").trim();
      const messageText = String(msg.text || "").trim();

      /*
        نطابق الاسم والنص الموجودين في الرسالة
      */

      if (
        name &&
        messageText &&
        text.includes(name) &&
        text.includes(messageText)
      ) {

        element.style.display = "none";
        element.dataset.expiredChat = "true";

      }

    });

  });
}


/* تشغيل النظام */
function startChatExpiry() {

  if (chatCleanupStarted) return;

  if (!window.firebaseApp) {

    setTimeout(startChatExpiry, 1000);

    return;
  }

  chatCleanupStarted = true;

  try {

    const db = getFirestore(window.firebaseApp);

    const chatRef = collection(db, CHAT_COLLECTION);

    onSnapshot(chatRef, snapshot => {

      const messages = [];

      snapshot.forEach(doc => {

        const data = doc.data();

        messages.push({
          id: doc.id,
          ...data
        });

      });

      hideExpiredMessages(messages);

      /*
        إعادة الفحص كلما تغيرت الدردشة
      */

      setTimeout(() => {
        hideExpiredMessages(messages);
      }, 1000);

    }, error => {

      console.error(
        "Emerald Chat Expiry Error:",
        error
      );

    });

  } catch (error) {

    console.error(
      "Emerald Chat Expiry Start Error:",
      error
    );

  }

}


/*
  ننتظر حتى يكون Firebase جاهزًا
*/

if (window.firebaseApp) {

  startChatExpiry();

} else {

  window.addEventListener(
    "firebase-ready",
    startChatExpiry,
    { once: true }
  );

}


/*
  فحص كل 10 ثوانٍ
  حتى تختفي الرسالة قريبًا من لحظة مرور 5 دقائق
*/

setInterval(() => {

  /*
    إعادة تشغيل الفحص إذا أصبحت الدردشة موجودة
  */

  if (!chatCleanupStarted) {
    startChatExpiry();
  }

}, 10000);

</script>
